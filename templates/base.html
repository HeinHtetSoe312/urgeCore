<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroLoans App</title>
    
    <script>
        var savedTheme = localStorage.getItem('theme');
        // We apply it to document.documentElement (which is the <html> tag). 
        // This exists immediately, unlike the <body> tag!
        if (savedTheme == 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="logo">MicroLoans</div>
            <ul class="nav-links">
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('active_loans') }}">Active Loans</a></li>
                <li><a href="{{ url_for('add_friend') }}">Add Friend</a></li>
                <li><a href="{{ url_for('request_loan') }}">Request Loan</a></li>
                <li><a href="{{ url_for('logout') }}" class="logout-btn" onclick="return confirm('Are you sure you want to log out?');">Logout</a></li>
            </ul>
            <button class="theme-toggle-btn" id="theme-toggle">🌓 Toggle Dark Mode</button>
        </nav>

        <main class="main-content">
            {% block main_content %}
            {% endblock %}
        </main>
    </div>

    <script>
        var toggleBtn = document.getElementById('theme-toggle');
        var rootElement = document.documentElement; // Targets the <html> tag
        
        toggleBtn.addEventListener('click', function() {
            var currentTheme = rootElement.getAttribute('data-theme');
            
            if (currentTheme == 'light') {
                rootElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                rootElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
